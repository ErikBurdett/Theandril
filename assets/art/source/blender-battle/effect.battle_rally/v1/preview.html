<!doctype html><meta charset="utf-8"><title>Blender impact studio review</title><style>body{background:#151519;color:#e1cf9f;font:16px sans-serif}img{image-rendering:pixelated}button{margin:12px}</style><h1>Studio candidate — not approved or in-game</h1><p>Each displayed frame is an actual Blender render, palette-reduced once. One-shot; Replay starts it again.</p><img id="native" width="64" height="64"><img id="large" width="256" height="256"><button id="play">Replay</button><pre id="frame"></pre><script>const paths=["native/frame-000.png", "native/frame-001.png", "native/frame-002.png", "native/frame-003.png", "native/frame-004.png", "native/frame-005.png", "native/frame-006.png", "native/frame-007.png"],durations=[100, 100, 100, 100, 100, 100, 100, 100];let timer;function show(i){clearTimeout(timer);for(const id of ["native","large"])document.getElementById(id).src=paths[i];document.getElementById("frame").textContent="Frame "+i+" · "+durations[i]+"ms";timer=setTimeout(()=>{if(i+1<paths.length)show(i+1);else{document.getElementById("native").style.visibility="hidden";document.getElementById("large").style.visibility="hidden"}},durations[i])}document.getElementById("play").onclick=()=>{for(const id of ["native","large"])document.getElementById(id).style.visibility="visible";show(0)};document.getElementById("play").click();</script>
