name: Verify build
on: [push, pull_request]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# CI only confirms the project typechecks and builds. Unit, campaign and
# browser gameplay tests run locally (pnpm test, pnpm test:gameplay).
jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
