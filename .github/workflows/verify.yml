name: Verify campaign
on: [push, pull_request]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate journal evidence at its real historical Git object.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm content:validate
      - run: pnpm test
      - run: pnpm art:validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:gameplay
      - run: pnpm bench
      - run: pnpm bench:chronicles
      - run: pnpm bench:art
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-results
          path: test-results/
