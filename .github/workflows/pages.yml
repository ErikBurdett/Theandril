name: Publish development demo to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# This publishes a development demo, not a 1.0 release. CI checks that it
# typechecks and builds; gameplay testing runs locally before publishing.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the requested master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Journal sources link immutable older checkpoints, checked by Vitest.
          fetch-depth: 0

      - name: Read the configured Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Enable Actions as the repository's Pages source in Settings first.
          # No administrative token or automatic repository mutation is needed.
          enablement: false

      - name: Set up the package-manager version from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Regenerate the master change feed from full history
        run: pnpm changelog:build

      - name: Build the actual Pages subpath
        env:
          # base_path is /Theandril for this project, or empty on a custom domain.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - name: Upload the production bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
